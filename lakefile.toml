name = "stlc"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Stlc"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.36.0"

[[lean_lib]]
name = "Stlc"
